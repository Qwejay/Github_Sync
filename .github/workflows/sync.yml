name: Universal Multi-Platform Code Sync Hub

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动运行
  workflow_dispatch: # 支持手动一键触发同步

jobs:
  # ====================================================
  # 阶段一：动态获取平台绑定账号，自动提取公开仓库列表
  # ====================================================
  discover-repos:
    runs-on: ubuntu-latest
    outputs:
      repo_list: ${{ steps.get-list.outputs.repo_list }}
      gitee_user: ${{ steps.prep.outputs.gitee_user }}
      gitlab_user: ${{ steps.prep.outputs.gitlab_user }}
      gitcode_user: ${{ steps.prep.outputs.gitcode_user }}
      has_gitee: ${{ steps.prep.outputs.has_gitee }}
      has_gitlab: ${{ steps.prep.outputs.has_gitlab }}
      has_gitcode: ${{ steps.prep.outputs.has_gitcode }}
    steps:
      # 1. 自动诊断并识别已配置 Token 的平台用户名
      - name: Diagnostic & Auto-Discover Platform Usernames
        id: prep
        run: |
          # 检查 Gitee
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            GITEE_USER=$(curl -s "https://gitee.com/api/v5/user?access_token=${{ secrets.GITEE_TOKEN }}" | jq -r '.login // empty')
            if [ -n "$GITEE_USER" ] && [ "$GITEE_USER" != "null" ]; then
              echo "gitee_user=$GITEE_USER" >> $GITHUB_OUTPUT
              echo "has_gitee=true" >> $GITHUB_OUTPUT
              echo "✅ Gitee 用户识别成功: $GITEE_USER"
            fi
          fi

          # 检查 GitLab
          if [ -n "${{ secrets.GITLAB_TOKEN }}" ]; then
            GITLAB_USER=$(curl -s --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" "https://gitlab.com/api/v4/user" | jq -r '.username // empty')
            if [ -n "$GITLAB_USER" ] && [ "$GITLAB_USER" != "null" ]; then
              echo "gitlab_user=$GITLAB_USER" >> $GITHUB_OUTPUT
              echo "has_gitlab=true" >> $GITHUB_OUTPUT
              echo "✅ GitLab 用户识别成功: $GITLAB_USER"
            fi
          fi

          # 检查 GitCode
          if [ -n "${{ secrets.GITCODE_TOKEN }}" ]; then
            GITCODE_USER=$(curl -s "https://api.gitcode.com/api/v5/user?access_token=${{ secrets.GITCODE_TOKEN }}" | jq -r '.login // empty')
            if [ -n "$GITCODE_USER" ] && [ "$GITCODE_USER" != "null" ]; then
              echo "gitcode_user=$GITCODE_USER" >> $GITHUB_OUTPUT
              echo "has_gitcode=true" >> $GITHUB_OUTPUT
              echo "✅ GitCode 用户识别成功: $GITCODE_USER"
            fi
          fi

      # 2. 调用 GitHub API 获取当前用户所有非 Fork 的公开仓库列表
      - name: Get GitHub Repository List
        id: get-list
        run: |
          GITHUB_USER="${{ github.repository_owner }}"
          CURRENT_REPO="${{ github.event.repository.name }}"
          
          echo "🔍 正在扫描 GitHub 用户 [$GITHUB_USER] 的公开仓库..."
          
          REPOS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${GITHUB_USER}/repos?per_page=100" \
            | jq -c --arg SELF "$CURRENT_REPO" '[.[] | select(.fork == false and .name != $SELF) | .name]')
          
          if [ "$REPOS" = "[]" ] || [ -z "$REPOS" ]; then
            echo "❌ 未检测到需要同步的公开仓库"
            exit 1
          fi
          echo "📢 准备同步以下仓库队列: $REPOS"
          echo "repo_list=$REPOS" >> $GITHUB_OUTPUT

  # ====================================================
  # 阶段二：并行矩阵（Matrix）自动建库 & 镜像推送
  # ====================================================
  sync-matrix:
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.discover-repos.outputs.repo_list) }}
      fail-fast: false
      max-parallel: 8
    steps:
      - name: Auto-Create Remote Repositories
        run: |
          REPO="${{ matrix.repo }}"
          echo "🛠️ 正在确保远程仓库 [$REPO] 存在..."

          # Gitee 建库
          if [ "${{ needs.discover-repos.outputs.has_gitee }}" = "true" ]; then
            curl -s -X POST "https://gitee.com/api/v5/user/repos" \
              -H "Content-Type: application/json" \
              -d '{"access_token":"${{ secrets.GITEE_TOKEN }}","name":"'"$REPO"'","private":false,"auto_init":false}' > /dev/null
          fi

          # GitLab 建库
          if [ "${{ needs.discover-repos.outputs.has_gitlab }}" = "true" ]; then
            curl -s -X POST "https://gitlab.com/api/v4/projects" \
              -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"'"$REPO"'","visibility":"public","initialize_with_readme":false}' > /dev/null
          fi

          # GitCode 建库
          if [ "${{ needs.discover-repos.outputs.has_gitcode }}" = "true" ]; then
            curl -s -X POST "https://api.gitcode.com/api/v5/user/repos?access_token=${{ secrets.GITCODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"'"$REPO"'","private":false,"auto_init":false}' > /dev/null
          fi

      - name: Sync Code & Git Tags
        run: |
          REPO="${{ matrix.repo }}"
          GITHUB_USER="${{ github.repository_owner }}"
          GITEE_USER="${{ needs.discover-repos.outputs.gitee_user }}"
          GITLAB_USER="${{ needs.discover-repos.outputs.gitlab_user }}"
          GITCODE_USER="${{ needs.discover-repos.outputs.gitcode_user }}"

          git clone --mirror "https://github.com/${GITHUB_USER}/$REPO.git" temp_repo
          cd temp_repo

          # 推送到 Gitee
          if [ "${{ needs.discover-repos.outputs.has_gitee }}" = "true" ]; then
            echo "🚀 镜像推送到 Gitee..."
            git push --mirror "https://${GITEE_USER}:${{ secrets.GITEE_TOKEN }}@gitee.com/${GITEE_USER}/$REPO.git" || echo "⚠️ Gitee 代码同步失败"
          fi

          # 推送到 GitLab
          if [ "${{ needs.discover-repos.outputs.has_gitlab }}" = "true" ]; then
            echo "🚀 镜像推送到 GitLab..."
            git push --mirror "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/${GITLAB_USER}/$REPO.git" || echo "⚠️ GitLab 代码同步失败"
          fi

          # 推送到 GitCode
          if [ "${{ needs.discover-repos.outputs.has_gitcode }}" = "true" ]; then
            echo "🚀 镜像推送到 GitCode..."
            git push --mirror "https://${GITCODE_USER}:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${GITCODE_USER}/$REPO.git" || echo "⚠️ GitCode 代码同步失败"
          fi

          cd ..
          rm -rf temp_repo

      - name: Sync Releases to Gitee
        if: ${{ needs.discover-repos.outputs.has_gitee == 'true' }}
        uses: trustedinster/sync-release-gitee@v1.3
        continue-on-error: true
        with:
          gitee_owner: ${{ needs.discover-repos.outputs.gitee_user }}
          gitee_repo: ${{ matrix.repo }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ matrix.repo }}
          gitee_upload_retry_times: 3
